project:
  type: website
  render:
    - "*.qmd"
    - "!CLAUDE.md"

website:
  # ↓ lo único que hay que cambiar al duplicar este repo
  title: "Este es mi sitio web"
  navbar:
    background: light
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "Lecciones"
        href: lecciones.qmd
  sidebar:
    style: floating
    contents:
      - section: "Índice del curso"
        contents: lecciones/*.qmd

format:
  html:
    # Estilo inspirado en devitoproject.org: el tema por defecto de Quarto
    # (fondo blanco, barra gris clara, fuente Source Sans Pro, enlaces azules).
    # Puedes cambiarlo por cualquier tema de https://quarto.org/docs/output-formats/html-themes.html
    theme: default
    mainfont: "Source Sans 3, Source Sans Pro, sans-serif"
    fontcolor: "#343a40"
    linkcolor: "#2761e3"
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=swap">
    toc: true
    toc-title: "En esta página"
    lang: es
    code-copy: hover
