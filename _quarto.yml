project:
  type: website

website:
  # ↓ lo único que hay que cambiar al duplicar este repo
  title: "Este es mi sitio web"
  navbar:
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "Unidad 1"
        href: unidad-1/index.qmd
      - text: "Unidad 2"
        href: unidad-2/index.qmd
      - text: "Unidad 3"
        href: unidad-3/index.qmd

  bread-crumbs: true
  sidebar:
    - id: inicio
      title: " "
      style: docked
      contents: []
    - id: u1
      style: docked
      contents:
        - section: "Unidad 1 · Fundamentos"
          contents: unidad-1/*.qmd
    - id: u2
      style: docked
      contents:
        - section: "Unidad 2 · Interés y descuento"
          contents: unidad-2/*.qmd
    - id: u3
      style: docked
      contents:
        - section: "Unidad 3 · Anualidades"
          contents: unidad-3/*.qmd


format:
  html:
    theme: cosmo
    toc: true
    toc-title: "En esta lección"
    lang: es
    fontsize: 1.05rem
    linestretch: 1.7
    title-block-banner: "#f4f4f5"

    # bloques de código: aquí sí se notan, porque los pinta Quarto
    highlight-style: github
    code-block-bg: true
    code-block-border-left: "#27272a"
    code-copy: hover

    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap">
        <style>
          :root {
            --tinta:      #27272a;
            --gris:       #52525b;
            --fondo:      #eeeef0;
            --superficie: #f4f4f5;
            --borde:      #dededf;
            --redonda: "Nunito", system-ui, -apple-system, sans-serif;
            --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
          }
          body { background: var(--fondo); color: var(--tinta); font-family: var(--redonda); }
          h1, h2, h3, h4, h5, #TOC, .sidebar, .navbar,
          .listing-title, .listing-date { font-family: var(--redonda); }
          h1, h2, h3 { color: var(--tinta); font-weight: 700; }
          h1 { font-size: 2.1rem; }
          a { color: var(--tinta); text-decoration-color: var(--borde); }
          a:hover { color: #000; text-decoration-color: var(--tinta); }
          .listing-title, .listing-title a, a.listing-title { color: var(--tinta) !important; }
          .listing-date { color: var(--gris); }
          .listing-item { border-bottom: 1px solid var(--borde); }
          .navbar { background-color: #ffffff !important; border-bottom: 1px solid var(--borde); }
          .navbar .navbar-brand { font-weight: 700; }
          .navbar .navbar-brand, .navbar .nav-link { color: var(--tinta) !important; }
          .quarto-title-banner { background: var(--superficie) !important; border-bottom: 1px solid var(--borde); }
          .quarto-title-banner h1, .quarto-title-banner .title { color: var(--tinta) !important; }
          #quarto-sidebar, .sidebar-navigation { background: transparent !important; }
          .sidebar-item-text { color: var(--gris); }
          .sidebar nav a.active, .sidebar-item a.active { color: var(--tinta) !important; font-weight: 700; }
          #TOC a.active, .sidebar nav[role=doc-toc] a.active {
            color: var(--tinta) !important; border-left-color: var(--tinta) !important; }
          code, pre { font-family: var(--mono); }
          .nav-footer { background: #ffffff; border-top: 1px solid var(--borde); color: var(--gris); }
          main.content {
            background: #ffffff; border: 1px solid var(--borde);
            border-radius: 12px; padding: 2rem 2.25rem; margin-top: 1.5rem; }
          .tarjeta-unidad {
            background: #ffffff; border: 1px solid var(--borde); border-radius: 12px;
            padding: 1.25rem 1.4rem; height: 100%; }
          .tarjeta-unidad h3 { margin-top: 0; font-size: 1.15rem; }
          .tarjeta-unidad p { color: var(--gris); margin-bottom: 0; }
        </style>
